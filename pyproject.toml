[project]
name = "voxcraft"
version = "0.1.0"
description = "自托管多模态音频推理服务 (ASR / TTS / 人声分离 / 视频翻译)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "structlog>=24.4",
    "httpx>=0.28",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "faster-whisper>=1.0",
    # Moonshine：边缘端低延迟 ASR，ONNX 后端。useful-moonshine-onnx 上游会
    # 拉入 onnxruntime（CPU EP）；GPU EP 由下面 onnxruntime-gpu 提供，运行时
    # 优先级在 MoonshineProvider._resolve_providers 里手动指定
    "useful-moonshine-onnx>=20251101",
    # onnxruntime-gpu 提供 CUDAExecutionProvider；与 onnxruntime（CPU）安装路径
    # 不冲突，pip 视为两个独立包，但 import onnxruntime 时只有一个生效——
    # onnxruntime-gpu 自带 CPU EP，所以装它单个即可
    "onnxruntime-gpu>=1.17",
    "piper-tts>=1.4.2",
    # modelscope：项目用 snapshot_download 拉模型镜像（CN 用户首选源）
    "modelscope>=1.27,<2",
    "openai>=1.50",
    "ffmpeg-python>=0.2.0",
    "zhconv>=1.4.3",
    # GPU：torch / torchaudio 给 demucs（人声分离）+ /health 探测；
    # faster-whisper 走 ctranslate2 不强需 torch，但生态里复用 torch 避免双 ABI。
    # torch 2.6 默认 PyPI wheel Linux 自带 CUDA 12.4 runtime（驱动 ≥ 525）、
    # mac arm64 自带 CPU/MPS wheel；仍兼容 Pascal sm_61。
    "torch>=2.6,<2.7",
    "torchaudio>=2.6,<2.7",
    "nvidia-ml-py>=12",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxcraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests that load real models (deselect with -m 'not slow')"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/voxcraft"]
branch = true
omit = [
    "*/providers/mock.py",       # 仅测试用 Mock 实现
    "*/db/migrate.py",           # Alembic 驱动脚手架
    "*/__main__.py",
]

[tool.coverage.report]
precision = 1
show_missing = false
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",  # Protocol / abstract stub
]
