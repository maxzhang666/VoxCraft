name: Build & Push Docker Image

# 触发规则：
# - push 到 master：构建并推送 latest / master / sha-<short>
# - tag v*.*.*：构建并推送语义版本
# - PR（默认）：仅构建验证，不推送
# - PR 贴上 `build-image` 标签：构建并推送 pr-<N> / sha-<short>，方便不合并主干
#   的情况下拉镜像在服务器上测试。摘掉标签不会回滚镜像（已 push 的版本不变）；
#   下次 commit 触发的是 synchronize 事件，仍按当前 label 状态决定是否 push。
# 单 image 架构（之前尝试过 base+app 拆分，CI 时间从 3min 涨到 15min，回滚）。
# 关键是 reproducibility 三层措施：
# 1. SOURCE_DATE_EPOCH=1 build-arg：build 内部工具（uv/pip）尊重固定时间戳
# 2. Dockerfile `find ... touch -h -d @0`：归一文件 mtime
# 3. outputs rewrite-timestamp=true：BuildKit 在打包 layer tar 时把所有
#    entry mtime 重写为 SOURCE_DATE_EPOCH。这一步关键——没有它，BuildKit 用
#    build wallclock 写 tar，文件 mtime 已统一也白搭。
# 三层叠加后 layer blob 跨 build 字节稳定，CI cache 与 client docker pull
# 都能精准命中。

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".idea/**"
      - ".vscode/**"
      - ".gitignore"
      - ".dockerignore"
  pull_request:
    branches: [master]
    # labeled 进队列让"贴 build-image 标签"成为推送镜像的触发器；不加 label
    # 的常规 PR 仍按 opened/synchronize/reopened 走仅构建验证路径。
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".idea/**"
      - ".vscode/**"
      - ".gitignore"
      - ".dockerignore"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # 当 GitHub 触发的是"加 label / 删 label"事件时，只对 build-image 这个标签
    # 反应——其他业务标签（如 needs-review / question）不浪费一次 ~3min 构建。
    # 非 labeled 事件（push / PR opened / synchronize / workflow_dispatch / tag）
    # 始终运行，由下面 gate 步骤决定 push or 仅构建。
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'build-image'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide whether to push the image
        # push 到 master / tag v* → push=true（一直如此）
        # PR 上贴了 build-image 标签 → push=true（这次新增）
        # 普通 PR → push=false（仅构建验证）
        id: gate
        env:
          HAS_BUILD_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'build-image') }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            push="$HAS_BUILD_LABEL"
          else
            push="true"
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "::notice title=push-decision::push=$push (event=${{ github.event_name }} action=${{ github.event.action }})"

      - name: Log in to GHCR
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker
          # 只有真要 push 镜像时才写 cache（mode=max 写所有中间层 ~3min 额外开销）。
          # 仅构建验证的 PR 不写 cache，省时间——读 cache 仍照常。
          cache-to: ${{ steps.gate.outputs.push == 'true' && 'type=gha,scope=docker,mode=max' || '' }}
          provenance: false
          # Reproducible build 三层措施（缺一不可——之前砍掉第三层后 client
          # 立刻报"又重下 3.8GB"，证伪了"前两层已经够"的乐观判断）：
          # 1. SOURCE_DATE_EPOCH build-arg：build 内部工具（uv/pip）尊重固定
          #    时间戳代替 build wallclock
          # 2. Dockerfile `find ... touch -h -d @0`：归一文件系统 mtime
          # 3. outputs rewrite-timestamp=true：BuildKit 在 export image 阶段把
          #    所有 layer tar entry mtime 重写为 SOURCE_DATE_EPOCH。前两层
          #    只让磁盘文件 mtime 稳定，但 BuildKit 打 tar 时仍可能用 build
          #    wallclock 写 entry header → tar blob 漂移 → client 重下。
          #    这条是真正让 layer blob 跨 build 字节稳定的开关。
          #
          # 代价：export 阶段重写 5GB image + cache_to mode=max 写所有中间
          # layer 共 ~7-8min。src-only commit 总 CI ~10min。这是 reproducibility
          # 的固定开销——换的是 client docker pull 永远 "Already exists"，
          # 长期看远胜每次重下 3.8GB。
          build-args: |
            SOURCE_DATE_EPOCH=1
          outputs: |
            type=image,push=${{ steps.gate.outputs.push == 'true' }},rewrite-timestamp=true
